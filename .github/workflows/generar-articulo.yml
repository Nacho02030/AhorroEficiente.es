name: Generar artículo automático

"on":
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PUBLISH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Generar artículos con IA
        id: generar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          SITE_NAME_ES: ${{ secrets.SITE_NAME_ES }}
          SITE_NICHE_ES: ${{ secrets.SITE_NICHE_ES }}
          SITE_NAME_EN: ${{ secrets.SITE_NAME_EN }}
          SITE_NICHE_EN: ${{ secrets.SITE_NICHE_EN }}
        run: python generar_articulo.py

      - name: Publicar en la web
        if: steps.generar.outputs.hubo_contenido == 'si'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _posts _posts_en temas_es.csv temas_en.csv
          git commit -m "Publicación automática de artículos" || exit 0
          git pull --rebase origin main
          git push

      - name: Pedir a GitHub Pages que reconstruya la web
        if: steps.generar.outputs.hubo_contenido == 'si'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "No se pudo pedir la reconstrucción"
